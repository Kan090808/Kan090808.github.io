schema: spec-driven

context: |
  Personal static site for GitHub Pages (username.github.io).
  Language: Traditional Chinese UI and content.
  Stack (this change): Vite + TypeScript + vanilla HTML/CSS, no React.
  Hosting: GitHub Pages via GitHub Actions from `main`.
  Content lives in-repo under `content/` and is baked into the static build.
  Editing exists only in local `vite` dev: production has no editor UI and no write API.
  Three public tabs: 個人資料, 推薦列表, 貼文.
  Recommendation seed categories: 開發工具, 動漫.

